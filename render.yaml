services:
  - type: web
    name: groundline-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: INSTALL_LOCAL_MODELS
        value: "false"
      - key: EMBEDDING_PROVIDER
        value: api
      - key: RERANK_PROVIDER
        value: api
      - key: PRELOAD_MODELS
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: MAX_UPLOAD_MB
        value: "0.3"
      - key: QUERIES_PER_DAY
        value: "50"
      - key: QUERY_MIN_INTERVAL_SECONDS
        value: "15"
      - key: MAX_DOCUMENTS
        value: "1"
      - key: MAX_STORAGE_MB
        value: "200"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      - key: RERANK_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://cloud.langfuse.com
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_DOMAIN
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
