services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: groundline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-groundline}
      POSTGRES_DB: groundline
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-groundline_app}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundline -d groundline"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://groundline_app:${APP_DB_PASSWORD:-groundline_app}@db:5432/groundline
      MIGRATION_DATABASE_URL: postgresql+asyncpg://groundline:${POSTGRES_PASSWORD:-groundline}@db:5432/groundline
      HF_HOME: /models
      COOKIE_SECURE: "false"
      COOKIE_DOMAIN: ""
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      RERANK_PROVIDER: ${RERANK_PROVIDER:-local}
      PRELOAD_MODELS: ${PRELOAD_MODELS:-true}
    volumes:
      - models:/models
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
  models:
