name: Keep API and database warm

on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl --fail --silent --show-error --max-time 120 --retry 3 --retry-all-errors -o /dev/null -w "%{http_code} %{time_total}s\n" https://api.groundline.antonmb.com/metrics/live

  keep-schedules-enabled:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * 1')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Re-enable the scheduled workflows, which GitHub turns off after 60 days without commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in keep-warm.yml eval.yml; do
            gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/enable"
            echo "enabled $workflow"
          done
